name: Test
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin versions agree across manifests and marketplace
        run: node bin/check-versions.mjs
      - name: loop-report deliver.py against the fake Orca CLI
        run: python3 -m unittest skills/loop-report/tests/test_deliver.py
      - name: confirmed design decisions remain read-only
        run: node --test skills/interview-report/tests/test_decisions.mjs
      - name: render fixtures with both views
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          fx = {"title": "t", "slug": "s", "generated": "2026-01-01", "summary": "s",
                "progress": {"state": "running", "updated": "2026-01-01T00:00:00Z"},
                "stages": [{"id": "a", "name": "A", "status": "done", "decisions": []}]}
          json.dump(fx, open("/tmp/m.json", "w"))
          subprocess.check_call([sys.executable, "skills/loop-report/assets/render.py", "--data", "/tmp/m.json", "--out", "/tmp/m.html", "--view", "skills/interview-report/assets/view.html"])
          fa = {"title": "t", "slug": "autocode", "generated": "2026-01-01", "summary": "s",
                "progress": {"state": "running", "updated": "2026-01-01T00:00:00Z"},
                "run": {"branch": "b", "metric": {"name": "m", "direction": "lower", "baseline": 1.0}, "budget": {"done": 0, "max": 4, "parallel": 1}, "strategist": {"tier": "deep"}, "terminatedReason": None},
                "hypotheses": []}
          json.dump(fa, open("/tmp/a.json", "w"))
          subprocess.check_call([sys.executable, "skills/loop-report/assets/render.py", "--data", "/tmp/a.json", "--out", "/tmp/a.html", "--view", "skills/autocode-board/assets/view.html"])
          PY
      - name: SKILL.md frontmatter parses as strict YAML
        run: |
          pip install -q pyyaml
          python3 - <<'PY'
          import glob, re, yaml
          for f in glob.glob("skills/*/SKILL.md") + glob.glob("plugins/*/skills/*/SKILL.md"):
              yaml.safe_load(re.match(r"^---\n(.*?)\n---\n", open(f, encoding="utf-8").read(), re.S).group(1))
          print("ok")
          PY
