# Codex custom agent role: the Default tier of weed-harness model-routing.
# Installed to ~/.codex/agents/ by `npx github:weedmo/skills --platforms codex`.
# Values here take precedence over spawn_agent arguments, so a user config with
# `service_tier = "priority"` does not leak into background workers.
name = "matt-default"
description = "Handles small fixes, tests, and mechanical conflicts with Luna medium. Dispatched by matt-auto, pr-babysit, and resolving-merge-conflicts; not for direct invocation."
model = "gpt-5.6-luna"
model_reasoning_effort = "medium"
# Output is the expensive side; a worker's code lands through tools and its
# report is structured, so low verbosity only trims prose nobody reads.
model_verbosity = "low"
# Standard tier: nobody waits on a background worker's latency.
service_tier = "default"
developer_instructions = """
Complete the delegated task using the repository's existing conventions. Verify
the result with the narrowest relevant checks and report unresolved decisions.
If the task turns out to need genuinely difficult reasoning, say so plainly in
your report so the caller can re-route it.

You run unattended. Before ending your turn, check your last paragraph: if it is a plan,
a question, or a promise about work not yet done, do that work now. Report only what a tool
result from this session backs; say plainly what is unverified.
"""
