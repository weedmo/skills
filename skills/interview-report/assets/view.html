<!--
  interview-report view for the loop-report shell: matt-auto's decision graph.
  render.py splices the <style> and <script> below into the shell; this file is
  never opened on its own. It registers window.LoopView (see loop-report's
  SKILL.md, "The view interface").

  View data (validated by validate.py next to this file):
    { stages: [ { id, name, skill, status, note, percent?,
                  decisions: [ { id, question, before, change, decision,
                                 rationale, escalated } ] } ],
      plan?: { concurrency, placement, note,
               waves: [ { id, mode, why, tickets: [ticketId] } ] },
      tickets?: [ { id, title, status, blockedBy, blocker: { reason, detail },
                    gates: { met, total }, route, estimateMin, actualMin,
                    startedAt, note,
                    worker: { model, effort, dispatchId, worktree },
                    acceptance: [text], steps: [ { name, status, note } ],
                    gateList: [ { id, text, status, check, expect, actual } ],
                    files: [ { path, added, removed } ],
                    commits: [ { sha, subject } ] } ],
      review?: { status, skill, note,
                 passes: [ { id, name, status, findings, note } ] },
      pr?: { number, url, base, branch, status, cycles, note,
             checks: [ { name, status, detail } ] } }
  Decision ids must be stable across regenerations — localStorage edits and
  the exported <slug>.edits.json both key on them.
-->
<style>
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 16px 0 32px; }
  .toolbar button {
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    height: 30px;
    padding: 0 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted-foreground);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .toolbar button:hover:not(:disabled) {
    background: var(--accent);
    border-color: var(--border-strong);
    color: var(--foreground);
  }
  .toolbar button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: var(--on-primary);
    font-weight: 600;
  }
  .toolbar button.primary:hover:not(:disabled) {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    color: var(--on-primary);
  }
  .toolbar button:disabled { opacity: 0.45; cursor: default; }
  .toolbar .count { color: var(--muted-foreground); font-size: 12px; }
  .toolbar .hint { flex-basis: 100%; max-width: 78ch; color: var(--muted-foreground); font-size: 12px; line-height: 1.6; }

  /* ── pipeline rail ─────────────────────────────────────────── */
  .stage { display: flex; gap: 18px; }
  .rail { display: flex; flex-direction: column; align-items: center; flex: 0 0 24px; }
  .rail .dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--background);
    flex: 0 0 auto;
    margin-top: 8px;
  }
  .stage.done .dot { border-color: var(--done); background: var(--done); }
  .stage.in-progress .dot { border-color: var(--progress); }
  .stage.skipped .dot { border-color: var(--border-strong); background: var(--secondary); }
  .rail .line { width: 1px; flex: 1 1 auto; background: var(--border-strong); min-height: 24px; }
  .stage:last-child .rail .line { display: none; }
  .stage-body { flex: 1 1 auto; padding-bottom: 26px; min-width: 0; }
  .stage-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .stage-head h2 { font-size: 1rem; font-weight: 600; margin: 0; }
  .stage-head .skill { color: var(--muted-foreground); font-size: 12px; font-family: var(--font-mono); }
  .stage-note { color: var(--muted-foreground); font-size: 12px; margin: 2px 0 0; }

  /* ── decision nodes ────────────────────────────────────────── */
  .decisions { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .node {
    border: 1px solid var(--border);
    border-left: 2px solid var(--border-strong);
    border-radius: var(--radius-md);
    background: var(--card);
  }
  .node.escalated { border-left-color: var(--escalated); }
  .node.edited { border-left-color: var(--edited); }
  .node.flagged { border-left-color: var(--flagged); }
  .node-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 14px; cursor: pointer; }
  .node-head .q { font-weight: 500; flex: 1 1 auto; min-width: 0; }
  .node-head .caret { color: var(--muted-foreground); transition: transform 0.15s; }
  .node.open .node-head .caret { transform: rotate(90deg); }
  .node-detail { display: none; padding: 0 14px 12px; }
  .node.open .node-detail { display: block; }
  .node-detail .d { margin: 0 0 4px; }
  .node-detail .d.struck { text-decoration: line-through; color: var(--muted-foreground); }
  .node-detail .r { color: var(--muted-foreground); font-size: 13px; margin: 0 0 10px; }
  .node-detail label { display: block; font-size: 11px; color: var(--muted-foreground); margin: 8px 0 2px; }
  .node-detail textarea, .node-detail input[type="text"] {
    width: 100%;
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    background: var(--background);
    color: var(--foreground);
  }
  .node-detail textarea { resize: vertical; min-height: 48px; }
  .ba {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: stretch;
    gap: 8px;
    margin: 0 0 10px;
  }
  .ba .cell {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--background);
    padding: 8px 10px;
    min-width: 0;
  }
  .ba .cell .lbl { display: block; font-size: 11px; color: var(--muted-foreground); margin-bottom: 2px; }
  .ba .cell.before .txt { color: var(--muted-foreground); }
  .ba .cell.before.none .txt { font-style: italic; }
  .ba .cell.after { border-color: var(--border-strong); }
  .ba .arrow { align-self: center; color: var(--muted-foreground); font-size: 13px; }
  @media (max-width: 560px) {
    .ba { grid-template-columns: 1fr; }
    .ba .arrow { transform: rotate(90deg); justify-self: start; }
  }
  .flag-row { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; }
  .flag-row input { accent-color: var(--flagged); }

  /* ── decision review, behind a disclosure ───────────────────── */
  .disclosure-wrap { margin-top: 18px; }
  .disclosure {
    display: flex; align-items: center; gap: 8px;
    width: 100%;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--foreground);
    cursor: pointer;
  }
  .disclosure:hover { border-color: var(--border-strong); }
  .disclosure .caret { color: var(--muted-foreground); transition: transform 0.15s; }
  .disclosure[aria-expanded="false"] .caret { transform: rotate(-90deg); }
  .disclosure .dcount { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--muted-foreground); }
  #decisions-body { padding-top: 4px; max-width: 1040px; }
  #decisions-body[hidden] { display: none; }

  /* ── dependency edges drawn over the wave columns ───────────── */
  /* The columns already say *when* a ticket runs; the edges say *why* it
     waits. The layer sits under the nodes so a curve never covers text,
     and an edge whose endpoint is collapsed is simply not drawn. */
  .flow { position: relative; }
  .dep-edges { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; overflow: visible; }
  .dep-edges path { fill: none; stroke: var(--muted-foreground); stroke-width: 1.5; opacity: 0.4; }
  .dep-edges .dep-arrow { fill: var(--muted-foreground); opacity: 0.4; }
  .wcol, .conn { position: relative; z-index: 1; }
</style>
<script>
window.LoopView = (function () {
  "use strict";

  var data = JSON.parse(document.getElementById("graph-data").textContent);
  var storeKey = "matt-auto-edits:" + data.slug;
  var el;

  // ── edits (localStorage where it exists; the sandboxed artifact frame has none) ──
  function loadEdits() {
    try { return JSON.parse(localStorage.getItem(storeKey)) || {}; } catch (e) { return {}; }
  }
  function saveEdits() {
    try { localStorage.setItem(storeKey, JSON.stringify(edits)); } catch (e) {}
  }
  var edits = loadEdits(); // { [decisionId]: { decision?, flagged?, comment? } }

  var decisionsById = {};
  (data.stages || []).forEach(function (s) {
    (s.decisions || []).forEach(function (d) { decisionsById[d.id] = { d: d, stage: s }; });
  });

  function editOf(id) { return edits[id] || {}; }
  function isEdited(id) {
    var e = editOf(id);
    return typeof e.decision === "string" && e.decision.trim() !== "" &&
           e.decision.trim() !== decisionsById[id].d.decision.trim();
  }
  function isFlagged(id) { return !!editOf(id).flagged; }
  function isChanged(id) { return isEdited(id) || isFlagged(id); }
  function changedIds() { return Object.keys(decisionsById).filter(isChanged); }
  function setEdit(id, patch) {
    var e = edits[id] || {};
    Object.keys(patch).forEach(function (k) { e[k] = patch[k]; });
    if ((typeof e.decision !== "string" || e.decision.trim() === "" ||
         e.decision.trim() === decisionsById[id].d.decision.trim()) &&
        !e.flagged && !(e.comment && e.comment.trim())) {
      delete edits[id];
    } else {
      edits[id] = e;
    }
    saveEdits();
  }

  var STATUS_LABEL = { "done": "완료", "in-progress": "진행 중", "pending": "대기", "skipped": "건너뜀" };
  var TICKET_STATUS_LABEL = {
    "done": "완료", "in-progress": "진행 중", "blocked": "막힘", "pending": "대기", "skipped": "건너뜀"
  };
  var BLOCKER_REASON_LABEL = {
    "gate": "게이트 미충족", "escalation": "사용자 답변 대기", "ci": "CI 실패",
    "conflict": "머지 충돌", "dependency": "선행 티켓 대기", "worker": "워커 이상",
    "review": "리뷰 변경 요청", "other": "막힘"
  };
  var GATE_STATUS_LABEL = { "met": "충족", "unmet": "미충족", "manual": "수동 확인", "pending": "대기" };
  var CHANGE_LABEL = { "new": "신규", "redirect": "방향 전환", "keep": "유지" };

  // ── tickets: estimates are the run's own guesses, so nothing here is presented as measurement ──
  function ticketsById() {
    var m = {};
    (data.tickets || []).forEach(function (tk) { m[tk.id] = tk; });
    return m;
  }
  var minutesSince, fmtMinutes;
  function remainingOf(tk) {
    var est = tk.estimateMin || 0;
    if (tk.status === "done" || tk.status === "skipped") return 0;
    if (tk.status === "in-progress" && tk.startedAt) return Math.max(est * 0.1, est - minutesSince(tk.startedAt));
    return est;
  }
  // A parallel wave costs its slowest ticket; a sequential one costs their sum.
  function remainingMinutes() {
    var byId = ticketsById();
    var waves = (data.plan && data.plan.waves) || null;
    if (!waves) {
      return (data.tickets || []).reduce(function (a, tk) { return a + remainingOf(tk); }, 0);
    }
    return waves.reduce(function (total, w) {
      var rs = (w.tickets || []).map(function (id) { return byId[id] ? remainingOf(byId[id]) : 0; });
      if (!rs.length) return total;
      return total + (w.mode === "parallel" ? Math.max.apply(null, rs) : rs.reduce(function (a, b) { return a + b; }, 0));
    }, 0);
  }
  function overallPercent() {
    var tks = (data.tickets || []).filter(function (tk) { return tk.status !== "skipped"; });
    if (!tks.length) return null;
    var weighted = tks.some(function (tk) { return tk.estimateMin; });
    var total = 0, done = 0;
    tks.forEach(function (tk) {
      var w = weighted ? (tk.estimateMin || 0) : 1;
      total += w;
      if (tk.status === "done") done += w;
      else if (tk.status === "in-progress") done += w * Math.min(0.9, tk.startedAt && tk.estimateMin ? minutesSince(tk.startedAt) / tk.estimateMin : 0.5);
    });
    return total ? Math.round((done / total) * 100) : 0;
  }
  // A stage's bar: its own `percent` when the run set one, otherwise derived —
  // done is 100, pending is 0, and an implement stage in flight follows its
  // tickets. Skipped stages get no bar at all.
  function stagePercent(s) {
    if (typeof s.percent === "number") return Math.max(0, Math.min(100, Math.round(s.percent)));
    if (s.status === "skipped") return null;
    if (s.status === "done") return 100;
    if (s.status === "pending") return 0;
    if (s.status === "in-progress") {
      var o = overallPercent();
      if (o !== null && (data.tickets || []).length && /implement|구현/i.test(s.id + " " + (s.name || ""))) return o;
      return null;
    }
    return null;
  }
  function waveDuration(w, byId) {
    var rs = (w.tickets || []).map(function (id) { return byId[id] ? (byId[id].estimateMin || 0) : 0; });
    if (!rs.length) return 0;
    return w.mode === "parallel" ? Math.max.apply(null, rs) : rs.reduce(function (a, b) { return a + b; }, 0);
  }
  function agentLabel(tk) {
    // "어떤 sub agent가 어떤 model로" — route first, then the model/effort it maps to.
    var parts = [];
    if (tk.route) parts.push(tk.route);
    var w = tk.worker || {};
    var ml = [w.model, w.effort].filter(Boolean).join("/");
    if (ml) parts.push(ml);
    return parts.join(" · ");
  }

  // ── ticket detail modal ────────────────────────────────────
  function openTicket(tk, ctx) {
    var st = tk.status || "pending";
    ctx.modal({
      id: tk.id || "", title: tk.title || "",
      badge: el("span", "badge " + (TICKET_STATUS_LABEL[st] ? st : "pending"), TICKET_STATUS_LABEL[st] || st)
    }, function (box) {
      if (tk.status === "blocked") {
        var b = tk.blocker || {};
        var blk = el("div", "blocker");
        blk.appendChild(el("div", "why", "막힘 — " + (BLOCKER_REASON_LABEL[b.reason] || b.reason || "이유 미기재")));
        if (b.detail) blk.appendChild(el("p", "detail", b.detail));
        box.appendChild(blk);
      }
      var who = ctx.section("워커");
      var dl = el("dl", "kv");
      ctx.kvRow(dl, "라우트", tk.route);
      var w = tk.worker || {};
      ctx.kvRow(dl, "모델", [w.model, w.effort].filter(Boolean).join(" / "), true);
      ctx.kvRow(dl, "디스패치", w.dispatchId, true);
      ctx.kvRow(dl, "워크트리", w.worktree, true);
      var timing = [];
      if (tk.estimateMin) timing.push("예상 " + fmtMinutes(tk.estimateMin));
      if (tk.actualMin) timing.push("실제 " + fmtMinutes(tk.actualMin));
      else if (tk.startedAt && tk.status === "in-progress") timing.push("경과 " + fmtMinutes(minutesSince(tk.startedAt)));
      ctx.kvRow(dl, "시간", timing.join(" · "));
      if (tk.blockedBy && tk.blockedBy.length) ctx.kvRow(dl, "선행", tk.blockedBy.join(", "), true);
      who.appendChild(dl);
      box.appendChild(who);

      if (tk.acceptance && tk.acceptance.length) {
        var acc = ctx.section("완료 조건");
        var ul = el("ul", "plain");
        tk.acceptance.forEach(function (a) { ul.appendChild(el("li", null, a)); });
        acc.appendChild(ul);
        box.appendChild(acc);
      }
      if (tk.steps && tk.steps.length) {
        var stp = ctx.section("이 티켓 안에서 일어난 일");
        var list = el("div", "steps");
        tk.steps.forEach(function (s) {
          var row = el("div", "step " + (s.status || "pending"));
          row.appendChild(el("span", "sdot"));
          row.appendChild(el("span", null, s.name));
          if (s.note) row.appendChild(el("span", "snote", s.note));
          list.appendChild(row);
        });
        stp.appendChild(list);
        box.appendChild(stp);
      }
      if (tk.gateList && tk.gateList.length) {
        var g = ctx.section("게이트" + (tk.gates && tk.gates.total ? " " + (tk.gates.met || 0) + "/" + tk.gates.total : ""));
        var gl = el("div", "glist");
        tk.gateList.forEach(function (gt) {
          var row = el("div", "gate " + (gt.status || "pending"));
          var line = el("div");
          line.appendChild(el("span", "gid", gt.id || ""));
          line.appendChild(el("span", null, gt.text || ""));
          line.appendChild(el("span", " badge " + (gt.status === "met" ? "done" : gt.status === "unmet" ? "flagged" : "escalated"),
            GATE_STATUS_LABEL[gt.status] || gt.status || ""));
          row.appendChild(line);
          if (gt.check) row.appendChild(el("div", "gcmd", "CHECK: " + gt.check));
          if (gt.expect || gt.actual) {
            row.appendChild(el("div", "gcmp",
              (gt.expect ? "기대 " + gt.expect : "") + (gt.actual ? " · 실제 " + gt.actual : "")));
          }
          gl.appendChild(row);
        });
        g.appendChild(gl);
        box.appendChild(g);
      }
      if (tk.files && tk.files.length) {
        var f = ctx.section("건드린 파일");
        var fl = el("div", "mfiles");
        tk.files.forEach(function (fi) {
          var row = el("div");
          row.appendChild(el("span", "p", fi.path));
          row.appendChild(el("span", "add", fi.added ? "+" + fi.added : ""));
          row.appendChild(el("span", "del", fi.removed ? "−" + fi.removed : ""));
          fl.appendChild(row);
        });
        f.appendChild(fl);
        box.appendChild(f);
      }
      if (tk.commits && tk.commits.length) {
        var c = ctx.section("커밋");
        var cl = el("div", "mfiles");
        tk.commits.forEach(function (cm) {
          var row = el("div");
          row.appendChild(el("span", "p", cm.sha || ""));
          row.appendChild(el("span", null, cm.subject || ""));
          cl.appendChild(row);
        });
        c.appendChild(cl);
        box.appendChild(c);
      }
      if (tk.note) box.appendChild(el("p", "note", tk.note));
    });
  }

  function renderTicketNode(tk, ctx) {
    var node = el("div", "tnode " + (tk.status || "pending"));
    // The edge layer finds both ends of a dependency by this attribute.
    if (tk.id) node.setAttribute("data-tid", tk.id);
    var head = el("div", "nhead");
    head.appendChild(el("span", "ndot"));
    head.appendChild(el("span", "nid", tk.id || ""));
    head.appendChild(el("span", "ntitle", tk.title || ""));
    node.appendChild(head);

    var meta = el("div", "nmeta");
    var st = tk.status || "pending";
    meta.appendChild(el("span", "badge " + (TICKET_STATUS_LABEL[st] ? st : "pending"), TICKET_STATUS_LABEL[st] || st));
    if (tk.gates && tk.gates.total) {
      meta.appendChild(el("span", "badge gates", "게이트 " + (tk.gates.met || 0) + "/" + tk.gates.total));
    }
    if (tk.estimateMin) meta.appendChild(el("span", "badge", "~" + fmtMinutes(tk.estimateMin)));
    node.appendChild(meta);

    var agent = agentLabel(tk);
    if (agent) node.appendChild(el("div", "nagent", agent));
    if (tk.worker && tk.worker.dispatchId) node.appendChild(el("div", "nagent", tk.worker.dispatchId));

    if (tk.status === "blocked") {
      var b = tk.blocker || {};
      node.appendChild(el("p", "nwhy",
        (BLOCKER_REASON_LABEL[b.reason] || b.reason || "막힘") + (b.detail ? ": " + b.detail : "")));
    } else if (tk.note) {
      node.appendChild(el("p", "nnote", tk.note));
    }
    ctx.clickable(node, "클릭하면 이 티켓의 상세를 봅니다", function () { openTicket(tk, ctx); });
    return node;
  }

  // Without a plan the tickets still lay out left to right: each blocking level
  // becomes its own column, so the shape survives a run that never planned waves.
  function derivedWaves(tickets) {
    var placed = {}, waves = [], guard = 0;
    var left = tickets.slice();
    while (left.length && guard++ < 50) {
      var ready = left.filter(function (tk) {
        return (tk.blockedBy || []).every(function (id) { return placed[id]; });
      });
      if (!ready.length) ready = left.slice();
      waves.push({ id: "W" + (waves.length + 1), mode: ready.length > 1 ? "parallel" : "sequential",
                   derived: true, tickets: ready.map(function (tk) { return tk.id; }) });
      ready.forEach(function (tk) { placed[tk.id] = true; });
      left = left.filter(function (tk) { return !placed[tk.id]; });
    }
    return waves;
  }

  function laneNode(title, status, rows, extra) {
    var node = el("div", "tnode " + (status || "pending"));
    var head = el("div", "nhead");
    head.appendChild(el("span", "ndot"));
    head.appendChild(el("span", "ntitle", title));
    node.appendChild(head);
    if (extra) node.appendChild(extra);
    (rows || []).forEach(function (r) { node.appendChild(r); });
    return node;
  }
  function checkRow(c) {
    var row = el("div", "checkrow " + (c.status || "pending"));
    row.appendChild(el("span", "cdot"));
    row.appendChild(el("span", null, c.name || ""));
    if (c.detail) row.appendChild(el("span", "cdetail", c.detail));
    return row;
  }
  // The run does not end at the last ticket: review and, in ship mode, the PR
  // are stages of the same left-to-right flow, not an afterthought in prose.
  function renderReviewLane() {
    var r = data.review;
    if (!r) return null;
    var lane = el("div", "wcol lane");
    var lh = el("div", "lhead");
    lh.appendChild(el("span", null, "리뷰"));
    lh.appendChild(el("span", "badge " + (r.status === "done" ? "done" : r.status === "blocked" ? "flagged" : "in-progress"),
      TICKET_STATUS_LABEL[r.status] || r.status || "대기"));
    if (r.skill) lh.appendChild(el("span", "wdur", r.skill));
    lane.appendChild(lh);
    (r.passes || []).forEach(function (pass) {
      var rows = [];
      if (typeof pass.findings === "number") {
        rows.push(el("div", "nnote", pass.findings ? "지적 " + pass.findings + "건" : "지적 없음"));
      }
      if (pass.note) rows.push(el("p", "nnote", pass.note));
      lane.appendChild(laneNode(pass.name || pass.id, pass.status, rows));
    });
    if (r.note) lane.appendChild(el("p", "nnote", r.note));
    return lane;
  }
  function renderPrLane() {
    var pr = data.pr;
    if (!pr) return null;
    var lane = el("div", "wcol lane");
    var lh = el("div", "lhead");
    lh.appendChild(el("span", null, "PR"));
    lh.appendChild(el("span", "badge " + (pr.status === "done" ? "done" : pr.status === "blocked" ? "flagged" : "in-progress"),
      TICKET_STATUS_LABEL[pr.status] || pr.status || "대기"));
    if (pr.cycles) lh.appendChild(el("span", "wdur", "사이클 " + pr.cycles));
    lane.appendChild(lh);
    var rows = [];
    if (pr.branch && pr.base) rows.push(el("div", "nagent", pr.branch + " → " + pr.base));
    (pr.checks || []).forEach(function (c) { rows.push(checkRow(c)); });
    if (pr.url) rows.push(el("div", "plink", pr.url));
    if (pr.note) rows.push(el("p", "nnote", pr.note));
    lane.appendChild(laneNode(pr.number ? "#" + pr.number : "PR", pr.status, rows));
    return lane;
  }

  // A wave column says *when* a ticket runs; an edge says *why* it waits.
  // `blockedBy` is the DAG edge (`blocker` is a different thing: a ticket that
  // is stuck). Both ends must be rendered — a collapsed wave hides its nodes,
  // so its edges drop out and the columns still read on their own.
  var SVG_NS = "http://www.w3.org/2000/svg";

  function makeEdgeLayer(flow, tickets) {
    var pairs = [];
    tickets.forEach(function (tk) {
      (tk.blockedBy || []).forEach(function (from) { pairs.push([from, tk.id]); });
    });
    if (!pairs.length) return null;

    var svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "dep-edges");
    svg.setAttribute("aria-hidden", "true");

    function redraw() {
      svg.textContent = "";
      var fr = flow.getBoundingClientRect();
      if (!fr.width) return;
      svg.setAttribute("width", flow.scrollWidth);
      svg.setAttribute("height", flow.scrollHeight);
      var rects = {};
      Array.prototype.forEach.call(flow.querySelectorAll(".tnode[data-tid]"), function (n) {
        rects[n.getAttribute("data-tid")] = n.getBoundingClientRect();
      });
      pairs.forEach(function (p) {
        var a = rects[p[0]], b = rects[p[1]];
        if (!a || !b) return;
        var x1 = a.right - fr.left, y1 = a.top - fr.top + a.height / 2;
        var x2 = b.left - fr.left, y2 = b.top - fr.top + b.height / 2;
        // Same column, or a plan that puts a ticket before what it waits on:
        // there is no readable curve to draw, so draw none.
        if (x2 - x1 < 8) return;
        var bend = Math.max(16, (x2 - x1) * 0.45);
        var line = document.createElementNS(SVG_NS, "path");
        line.setAttribute("d", "M" + x1 + "," + y1 + " C" + (x1 + bend) + "," + y1 +
          " " + (x2 - bend) + "," + y2 + " " + (x2 - 5) + "," + y2);
        svg.appendChild(line);
        var arrow = document.createElementNS(SVG_NS, "path");
        arrow.setAttribute("class", "dep-arrow");
        arrow.setAttribute("d", "M" + x2 + "," + y2 + " L" + (x2 - 6) + "," + (y2 - 3.5) +
          " L" + (x2 - 6) + "," + (y2 + 3.5) + " Z");
        svg.appendChild(arrow);
      });
    }
    return { svg: svg, redraw: redraw };
  }

  // Tickets are nodes, waves are columns, and the run reads left to right —
  // the same shape the coordinator actually executes.
  function renderFlow(host, ctx) {
    var tickets = data.tickets || [];
    var extraLanes = [renderReviewLane(), renderPrLane()].filter(Boolean);
    if (!tickets.length && !extraLanes.length) return;
    var byId = ticketsById();
    var plan = data.plan || {};
    var waves = tickets.length
      ? ((plan.waves && plan.waves.length) ? plan.waves : derivedWaves(tickets))
      : [];

    var head = el("div", "flow-head");
    // A small-path run has no waves — only the review / PR lanes — so the
    // heading says what is actually there.
    head.appendChild(el("span", "phead", waves.length ? "실행 계획"
      : [data.review ? "리뷰" : null, data.pr ? "PR" : null].filter(Boolean).join(" · ")));
    if (plan.concurrency) head.appendChild(el("span", "badge", "동시 " + plan.concurrency));
    if (plan.placement) head.appendChild(el("span", "badge", plan.placement));
    var liveIndex = waves.findIndex(function (w) {
      return (w.tickets || []).some(function (id) {
        var tk = byId[id];
        return tk && tk.status !== "done" && tk.status !== "skipped";
      });
    });
    if (waves.length) {
      head.appendChild(el("span", "badge", "웨이브 " + (liveIndex < 0 ? waves.length : liveIndex + 1) + "/" + waves.length));
    }
    // A long run is mostly finished waves; they collapse to stubs by default so
    // the live one is what the reader lands on. One button brings them all back.
    var expandAll = false;
    var btnAll = el("button", "wtoggle spacer", "완료 웨이브 펼치기");
    if (waves.length > 3) head.appendChild(btnAll);
    host.appendChild(head);

    var wrap = el("div", "flow-wrap");
    var flow = el("div", "flow");
    wrap.appendChild(flow);
    var edges = makeEdgeLayer(flow, tickets);

    function draw() {
      flow.textContent = "";
      // First child, so the columns paint over the curves rather than under.
      if (edges) flow.appendChild(edges.svg);
      var liveCol = null;
      waves.forEach(function (w, i) {
        if (i) {
          var conn = el("div", "conn");
          conn.appendChild(el("span", null, "→"));
          flow.appendChild(conn);
        }
        var tks = (w.tickets || []).map(function (id) { return byId[id] || { id: id, title: "" }; });
        var allDone = tks.length && tks.every(function (tk) { return tk.status === "done" || tk.status === "skipped"; });
        var collapsed = allDone && !expandAll && waves.length > 3;
        var col = el("div", "wcol" + (collapsed ? " collapsed" : ""));
        var wh = el("div", "whead");
        wh.appendChild(el("span", null, w.id || ("W" + (i + 1))));
        if (!collapsed) {
          // A derived column is a dependency level, not a promise that its tickets
          // run at once — only a planned wave claims parallelism.
          wh.appendChild(el("span", "badge " + (w.mode === "parallel" ? "new" : "keep"),
            w.mode !== "parallel" ? "순차" : (w.derived ? "독립 " + tks.length : "병렬 " + tks.length)));
          var dur = waveDuration(w, byId);
          if (dur) wh.appendChild(el("span", "wdur", "≈" + fmtMinutes(dur)));
        }
        col.appendChild(wh);
        if (collapsed) {
          var stub = el("button", "wtoggle", "✓ " + tks.length + "개\n펼치기");
          stub.addEventListener("click", function () {
            col.classList.remove("collapsed");
            col.removeChild(stub);
            tks.forEach(function (tk) { col.appendChild(renderTicketNode(tk, ctx)); });
            // The nodes this column just revealed are the ends of edges that
            // were dropped; the flow's own box may not change, so ask directly.
            if (edges) requestAnimationFrame(edges.redraw);
          });
          col.appendChild(stub);
        } else {
          tks.forEach(function (tk) { col.appendChild(renderTicketNode(tk, ctx)); });
          if (w.why) col.appendChild(el("p", "why", w.why));
        }
        if (i === liveIndex) liveCol = col;
        flow.appendChild(col);
      });
      extraLanes.forEach(function (lane, i) {
        if (waves.length || i) {
          var conn2 = el("div", "conn");
          conn2.appendChild(el("span", null, "→"));
          flow.appendChild(conn2);
        }
        flow.appendChild(lane);
      });
      // Land on the wave that is actually running, not on the finished history.
      if (liveCol) {
        requestAnimationFrame(function () {
          wrap.scrollLeft = Math.max(0, liveCol.offsetLeft - flow.offsetLeft - 12);
        });
      }
      // The nodes need to be laid out before an edge can be measured.
      if (edges) requestAnimationFrame(edges.redraw);
    }
    btnAll.addEventListener("click", function () {
      expandAll = !expandAll;
      btnAll.textContent = expandAll ? "완료 웨이브 접기" : "완료 웨이브 펼치기";
      draw();
    });
    draw();
    host.appendChild(wrap);
    // Expanding a collapsed wave and resizing the window both change the flow's
    // box; either way the measured edges have to be taken again.
    if (edges && window.ResizeObserver) new ResizeObserver(edges.redraw).observe(flow);
    if (plan.note) host.appendChild(el("p", "why", plan.note));
  }

  // ── decision nodes ─────────────────────────────────────────
  var updateToolbar = function () {};
  function renderNode(d) {
    var node = el("div", "node");
    if (d.escalated) node.classList.add("escalated");

    var head = el("div", "node-head");
    head.appendChild(el("span", "caret", "▸"));
    head.appendChild(el("span", "q", d.question));
    var badges = el("span", "badges");
    if (CHANGE_LABEL[d.change]) badges.appendChild(el("span", "badge " + d.change, CHANGE_LABEL[d.change]));
    if (d.escalated) badges.appendChild(el("span", "badge escalated", "직접 답변"));
    var readOnly = d.source === "design-map";
    if (readOnly) badges.appendChild(el("span", "badge done", "설계에서 확정"));
    var editedBadge = el("span", "badge edited", "수정됨");
    var flaggedBadge = el("span", "badge flagged", "문제");
    badges.appendChild(editedBadge);
    badges.appendChild(flaggedBadge);
    head.appendChild(badges);
    node.appendChild(head);

    var detail = el("div", "node-detail");
    var dLine;
    if (d.change) {
      var ba = el("div", "ba");
      var before = el("div", "cell before" + (d.before ? "" : " none"));
      before.appendChild(el("span", "lbl", "이전"));
      before.appendChild(el("span", "txt", d.before || "없음 — 정해진 바 없었음"));
      ba.appendChild(before);
      ba.appendChild(el("span", "arrow", "→"));
      var after = el("div", "cell after");
      after.appendChild(el("span", "lbl", "이후"));
      dLine = el("span", "txt d", d.decision);
      after.appendChild(dLine);
      ba.appendChild(after);
      detail.appendChild(ba);
    } else {
      dLine = el("p", "d", d.decision);
      detail.appendChild(dLine);
    }
    detail.appendChild(el("p", "r", d.rationale));

    // Decisions carried in from a design-map spec are settled: no edit box, no
    // flag, so they never reach <slug>.edits.json. Changing one is a chat
    // request that matt-auto records as an interview-stage redirect.
    var ta = null, cb = null, comment = null;
    if (readOnly) {
      detail.appendChild(el("p", "r", "design-map에서 확정된 결정입니다. 바꾸려면 채팅으로 말해 주세요 — 인터뷰 단계의 방향 전환으로 기록됩니다."));
    } else {
      detail.appendChild(el("label", null, "결정 수정 (그대로 두면 유지됩니다)"));
      ta = document.createElement("textarea");
      ta.value = typeof editOf(d.id).decision === "string" ? editOf(d.id).decision : d.decision;
      detail.appendChild(ta);

      var flagRow = el("div", "flag-row");
      cb = document.createElement("input");
      cb.type = "checkbox";
      cb.id = "flag-" + d.id;
      cb.checked = isFlagged(d.id);
      var cbLabel = document.createElement("label");
      cbLabel.htmlFor = cb.id;
      cbLabel.textContent = "문제로 표시";
      cbLabel.style.margin = "0";
      flagRow.appendChild(cb);
      flagRow.appendChild(cbLabel);
      detail.appendChild(flagRow);

      detail.appendChild(el("label", null, "코멘트 (무엇이 문제인지 / 대신 원하는 방향)"));
      comment = document.createElement("input");
      comment.type = "text";
      comment.value = editOf(d.id).comment || "";
      detail.appendChild(comment);
    }
    node.appendChild(detail);

    function refresh() {
      node.classList.toggle("edited", isEdited(d.id));
      node.classList.toggle("flagged", isFlagged(d.id));
      editedBadge.style.display = isEdited(d.id) ? "" : "none";
      flaggedBadge.style.display = isFlagged(d.id) ? "" : "none";
      dLine.classList.toggle("struck", isEdited(d.id));
      updateToolbar();
    }
    head.addEventListener("click", function () { node.classList.toggle("open"); });
    if (ta) ta.addEventListener("input", function () { setEdit(d.id, { decision: ta.value }); refresh(); });
    if (cb) cb.addEventListener("change", function () { setEdit(d.id, { flagged: cb.checked }); refresh(); });
    if (comment) comment.addEventListener("input", function () { setEdit(d.id, { comment: comment.value }); refresh(); });
    refresh();
    return node;
  }

  function exportPayload() {
    return {
      slug: data.slug,
      exported: new Date().toISOString(),
      edits: changedIds().map(function (id) {
        var entry = decisionsById[id];
        var e = editOf(id);
        return {
          id: id,
          stage: entry.stage.id,
          question: entry.d.question,
          before: entry.d.before || null,
          change: entry.d.change || null,
          original: entry.d.decision,
          edited: isEdited(id) ? e.decision.trim() : null,
          flagged: isFlagged(id),
          comment: (e.comment || "").trim()
        };
      })
    };
  }

  // ── the decision review section (disclosure + toolbar + graph) ──
  function renderDecisions(host, ctx) {
    var total = Object.keys(decisionsById).length;
    var wrap = el("section", "disclosure-wrap");
    var decBtn = el("button", "disclosure");
    decBtn.type = "button";
    decBtn.appendChild(el("span", "caret", "▾"));
    decBtn.appendChild(el("span", "dtitle", "결정 검토"));
    decBtn.appendChild(el("span", "dcount", "결정 " + total + "개" + (data.progress ? " · 검토하고 수정할 수 있습니다" : "")));
    wrap.appendChild(decBtn);
    var decBody = el("div");
    decBody.id = "decisions-body";
    wrap.appendChild(decBody);

    var toolbar = el("div", "toolbar");
    var btnExport = el("button", "primary", "수정 내보내기");
    var btnReset = el("button", null, "수정 초기화");
    var countEl = el("span", "count");
    var hint = el("span", "hint");
    hint.appendChild(document.createTextNode("노드를 클릭하면 근거를 보고, 결정을 고치거나 문제로 표시할 수 있습니다. 내보내기는 "));
    hint.appendChild(el("code", null, data.slug + ".edits.json"));
    hint.appendChild(document.createTextNode(" 파일을 만듭니다 — "));
    hint.appendChild(el("code", null, "docs/agents/matt-auto-log/"));
    hint.appendChild(document.createTextNode("에 저장해 두면 다음 실행 때 matt-auto가 해당 스테이지부터 다시 작업합니다."));
    toolbar.appendChild(btnExport);
    toolbar.appendChild(btnReset);
    toolbar.appendChild(countEl);
    toolbar.appendChild(hint);
    decBody.appendChild(toolbar);
    var graph = el("div");
    graph.id = "graph";
    decBody.appendChild(graph);

    updateToolbar = function () {
      var n = changedIds().length;
      countEl.textContent = n ? "노드 " + n + "개 변경됨" : "변경 없음";
      btnExport.disabled = n === 0;
      btnReset.disabled = Object.keys(edits).length === 0;
    };

    // At the interview gate the decisions are the report, so it opens; once a
    // run is under way progress is what the reader came for, so it starts
    // collapsed. Either way the reader's own choice wins and survives the reload.
    function setDecisions(open) {
      decBtn.setAttribute("aria-expanded", open ? "true" : "false");
      decBody.hidden = !open;
    }
    var decPref = ctx.prefs().dec;
    setDecisions(decPref ? decPref === "open" : !data.progress);
    decBtn.addEventListener("click", function () {
      var open = decBtn.getAttribute("aria-expanded") !== "true";
      ctx.setPref("dec", open ? "open" : "closed");
      setDecisions(open);
    });

    (data.stages || []).forEach(function (s) {
      var stage = el("div", "stage " + s.status);
      var rail = el("div", "rail");
      rail.appendChild(el("div", "dot"));
      rail.appendChild(el("div", "line"));
      stage.appendChild(rail);
      var body = el("div", "stage-body");
      var headRow = el("div", "stage-head");
      headRow.appendChild(el("h2", null, s.name));
      if (s.skill) headRow.appendChild(el("span", "skill", s.skill));
      headRow.appendChild(el("span", "badge " + s.status, STATUS_LABEL[s.status] || s.status));
      body.appendChild(headRow);
      var pct = stagePercent(s);
      if (pct !== null) {
        var pbox = el("div", "stage-bar");
        pbox.appendChild(ctx.bar(pct, pct >= 100 ? "done" : ""));
        var plabel = el("div", null);
        plabel.appendChild(el("span", "pct", pct + "%"));
        pbox.appendChild(plabel);
        body.appendChild(pbox);
      }
      if (s.note) body.appendChild(el("p", "stage-note", s.note));
      if (s.decisions && s.decisions.length) {
        var list = el("div", "decisions");
        s.decisions.forEach(function (d) { list.appendChild(renderNode(d)); });
        body.appendChild(list);
      }
      stage.appendChild(body);
      graph.appendChild(stage);
    });

    btnExport.addEventListener("click", function () {
      var json = JSON.stringify(exportPayload(), null, 2);
      var blob = new Blob([json], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = data.slug + ".edits.json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(a.href);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).catch(function () {});
      }
    });
    btnReset.addEventListener("click", function () {
      edits = {};
      try { localStorage.removeItem(storeKey); } catch (e) {}
      location.reload();
    });
    updateToolbar();
    host.appendChild(wrap);
  }

  function bind(ctx) {
    el = ctx.el;
    minutesSince = ctx.minutesSince;
    fmtMinutes = ctx.fmtMinutes;
  }

  return {
    kind: "결정 그래프",
    meta: function () { return "결정 " + Object.keys(decisionsById).length + "개"; },
    // The run-wide numbers: percent (estimate-weighted), what is left, and the
    // ticket count for the 진행 상황 heading. Null before tickets exist.
    progress: function (d, ctx) {
      bind(ctx);
      var tickets = d.tickets || [];
      if (!d.progress && !tickets.length) return null;
      var pct = overallPercent();
      var doneCount = tickets.filter(function (tk) { return tk.status === "done"; }).length;
      return {
        percent: pct === null ? undefined : pct,
        remainingMin: tickets.length ? remainingMinutes() : 0,
        count: tickets.length ? "티켓 " + doneCount + "/" + tickets.length : ""
      };
    },
    blockers: function (d) {
      return (d.tickets || []).filter(function (tk) { return tk.status === "blocked"; }).map(function (tk) {
        var b = tk.blocker || {};
        return { title: (tk.id ? tk.id + " " : "") + (tk.title || ""),
                 reason: BLOCKER_REASON_LABEL[b.reason] || b.reason || "이유 미기재", detail: b.detail || "" };
      });
    },
    renderProgress: function (host, ctx) { bind(ctx); renderFlow(host, ctx); },
    render: function (host, ctx) { bind(ctx); renderDecisions(host, ctx); },
    hasUnsavedEdits: function () { return changedIds().length > 0; }
  };
})();
</script>
